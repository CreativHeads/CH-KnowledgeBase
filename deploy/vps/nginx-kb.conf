# Nginx: sends kb.creativheads.com to Brandroom on this same machine.
# Install:  sudo cp deploy/vps/nginx-kb.conf /etc/nginx/conf.d/kb.creativheads.com.conf
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (VPS.md, step 8) and it adds the HTTPS part to this file by itself.
server {
    listen 80;
    listen [::]:80;
    server_name kb.creativheads.com;

    # The biggest request the app sends is a ~3.3 MB piece of a large file.
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended, so nobody can fake the address used to slow down password guessing.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
