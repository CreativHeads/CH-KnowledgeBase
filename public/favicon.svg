  <!-- Layer 3 (Bottom Shelf / Open Book) -->
  <path d="M 95 142 L 97 144 C 101 146 105 147 109 149 L 215 149 C 219 147 222 147 225 150 C 226.5 152 227 155 227 161 C 227 170 220 178 208 178 L 114 178 C 102 178 95 170 95 161 Z" fill="#ffffff"/>

  <!-- Registered Trademark ® -->
  <g fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.9">
    <circle cx="262.5" cy="25.5" r="9"/>
    <text x="262.5" y="29.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#ffffff" stroke="none" text-anchor="middle">R</text>
  </g>
