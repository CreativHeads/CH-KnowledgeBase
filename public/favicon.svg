<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 298 298" width="100%" height="100%">
  <defs>
    <!-- Main vibrant blue to soft lavender gradient -->
    <linearGradient id="brandroomGrad" x1="12%" y1="95%" x2="88%" y2="8%">
      <stop offset="0%" stop-color="#0e6efd"/>
      <stop offset="30%" stop-color="#389eff"/>
      <stop offset="60%" stop-color="#80b8ff"/>
      <stop offset="85%" stop-color="#c5d1fb"/>
      <stop offset="100%" stop-color="#edd0bb"/>
    </linearGradient>
    
    <!-- Warm peach/amber glow on top right -->
    <radialGradient id="brandroomPeach" cx="88%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#fed6b8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f7cbab" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#e8c6be" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#80b8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path matching badge contour -->
    <clipPath id="badgeClip">
      <path d="M 121 2 L 260 2 A 36 36 0 0 1 296 38 L 296 205 A 36 36 0 0 1 260 241 L 121 241 A 120 120 0 0 1 1 121 A 120 120 0 0 1 121 2 Z"/>
    </clipPath>
  </defs>

  <!-- Badge Background -->
  <g clip-path="url(#badgeClip)">
    <rect width="298" height="243" fill="url(#brandroomGrad)"/>
    <rect width="298" height="243" fill="url(#brandroomPeach)"/>
  </g>

  <!-- Layer 1 (Top Pill) -->
  <path d="M 116 63 L 206 63 C 218 63 227 72 227 82 C 227 92 218 100 206 100 L 116 100 C 104 100 95 92 95 82 C 95 72 104 63 116 63 Z" fill="#ffffff"/>

